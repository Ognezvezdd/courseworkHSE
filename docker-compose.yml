services:
  # Python API
  python-api:
    build:
      context: ./python
      dockerfile: common/Dockerfile
    container_name: ai-agents-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - ai-platform
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./python/output:/app/output
      - ./python/agents:/app/agents

  # C++ Telegram Bot
  telegram-bot:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    container_name: ai-agents-bot
    depends_on:
      python-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-platform
    environment:
      - API_URL=http://python-api:8000
    volumes:
      # config.json
      - ./cpp/config.json:/app/config.json:ro
      - ./python/output:/app/output:ro
    command: [ "./build/tg_bot" ]

networks:
  ai-platform:
    driver: bridge
